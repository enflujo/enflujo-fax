  <body>
    <header>
      <h1>
        <span class="palabra2"
          ><span class="letra1"><span class="puntoFuente puntoInicial" style="--espera: 0s">E</span></span
          ><span class="letra2"><span class="puntoFuente" style="--espera: 18s">s</span></span
          ><span class="letra3"><span class="puntoFuente" style="--espera: 9s">t</span></span
          ><span class="letra4"><span class="puntoFuente" style="--espera: 27s">o</span></span>
          <span class="palabra2"
            ><span class="puntoFuente" style="--espera: 3s">e</span
            ><span class="puntoFuente" style="--espera: 21s">s</span>
            <span class="puntoFuente" style="--espera: 12s">u</span
            ><span class="puntoFuente" style="--espera: 30s">n</span></span
          >
          <span class="puntoFuente" style="--espera: 6s">f</span><span class="puntoFuente" style="--espera: 24s">a</span
          ><span class="puntoFuente" style="--espera: 15s">x</span>
        </span>
      </h1>
      <!-- <p class="subtitulo">
        &#128570; <br />

        Pero sólo recibe imágenes <br />
        ... <br />
        Imágenes de animales y plantas <br />
        . <br />
        &#127793; <br />
      </p> -->
    </header>

    <main id="contenedor">
      <div id="contenedorTransmision">
        <img id="transmision" width="640" height="480" alt="Transmisión en vivo de la impresora" />
        <span class="senalEnVivo" aria-hidden="true">En vivo</span>
        <div id="estadoCamara" role="status" aria-live="polite">Conectando cámara…</div>
      </div>

      <!-- <div id="contenedorImpresora" class="marco"><img src="https://muchachita.enflujo.com/" /></div> -->
      <div id="fotomatica" class="marco">
        <label for="buzon" class="mensajeBuzon">
          <span>Mándanos una foto</span>
          <span class="ayudaBuzon">Toca aquí para elegirla</span>
        </label>
        <input id="buzon" class="entradaArchivo" type="file" accept="image/*" name="buzon" />
      </div>

      <div id="contenedorEditor">
        <canvas id="lienzo" aria-label="Vista previa de la foto preparada para impresión"></canvas>
      </div>

      <div id="contenedorProceso">
        <p id="estadoProceso" role="status" aria-live="polite"></p>
        <button id="botonImprimir" class="oculto" type="button">Imprimir</button>
        <button id="cambiarFoto" class="cambiarFoto" type="button">Elegir otra foto</button>
        <div id="cargador" class="oculto" aria-hidden="true">
          <span id="porcentaje">0%</span>
          <span id="proceso"></span>
        </div>
      </div>
    </main>
    <!-- <footer>EnFlujo</footer> -->
    <canvas id="fondo"></canvas>
    <script type="module" src="/fuente/programa.ts"></script>
  </body>
</html>
